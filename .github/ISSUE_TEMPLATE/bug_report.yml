name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open live view with two cameras
        2. Restart the backend
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Client version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Qt version
      placeholder: Ubuntu 24.04, Qt 6.8.3
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove camera credentials and tokens first.
      render: text
